upstream newsly_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=10r/m;

server {
    listen 80;
    server_name api.newsly.app;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.newsly.app;

    # ── TLS ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.newsly.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.newsly.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "DENY"              always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-XSS-Protection          "1; mode=block"     always;
    add_header Referrer-Policy           "no-referrer"       always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Request size ──────────────────────────────────────────────────────────
    client_max_body_size 10M;

    # ── Proxy settings ────────────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # ── Auth endpoints (strict rate limit) ───────────────────────────────────
    location ~ ^/api/v1/auth/(login|register|forgot-password|google|apple) {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://newsly_backend;
    }

    # ── General API ───────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://newsly_backend;
    }

    # ── Health check (no rate limit) ──────────────────────────────────────────
    location /health {
        proxy_pass http://newsly_backend;
        access_log off;
    }

    # ── Swagger docs (restrict in production via IP if needed) ───────────────
    location /api/docs {
        proxy_pass http://newsly_backend;
    }

    # ── Block hidden files ────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
